name: Build Debug APK

# Builds an installable debug APK on every push — Nida downloads it from
# the Actions tab (Artifacts) and installs it on her phone for testing.
# No local Android SDK needed.

on:
  push:
    paths:
      - 'apps/rozana-calculators/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/rozana-calculators
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/rozana-calculators/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Add Android platform
        run: npx cap add android

      - name: Sync web assets
        run: npx cap sync android

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build debug APK
        run: ./gradlew assembleDebug
        working-directory: apps/rozana-calculators/android

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: rozana-calculators-debug-apk
          path: apps/rozana-calculators/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
